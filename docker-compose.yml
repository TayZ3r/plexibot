version: '3.8'
networks:
   bot:
     driver: bridge
volumes:
  bot:

services: 
  bot: 
    build: .
    container_name: BotCore
    volumes:
      - bot:/app
    # Webhook Overseerr/Plexify (inutile d'exposer si Plexify est sur le même réseau Docker)
    ports:
      - "3000:3000"
    environment:
      - TOKEN=
      - PRESENCE_ROLE=
      - PRESENCE_STRING=discord.gg/akira13345
      - SUGGESTION_CHANNEL=
      - MEMBERS_CHANNEL_ID=
      - CONNECTED_USERS_CHANNEL_ID=
      - IP=play.remainsky.fr
      - BOOST_ROLE_ID=
      - BOOST_CHANNEL_ID=
      - TEMPORARY_VOICE_CATEGORY=
      - TEMPORARY_VOICE_CHANNEL=
      - WELCOME_CHANNEL_ID=
      - MEMBER_ROLE_ID=
      - SUPPORT_ROLE_ID=
      - TICKET_LOGS=
      - ADMIN_API_URL=http://plexify-admin:5000
      - BOT_API_KEY=
      - CLAUDE_CODE_OAUTH_TOKEN=
      - TMDB_API_KEY=
      - TRAKT_CLIENT_ID=
      - PLEX_URL=
      - PLEX_TOKEN=
      - OVERSEERR_WEBHOOK_PORT=3000
      - OVERSEERR_WEBHOOK_SECRET=
      - OVERSEERR_TEST_DISCORD_ID=
